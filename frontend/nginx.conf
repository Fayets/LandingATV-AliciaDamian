server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    # Sin Cache-Control el navegador decide por su cuenta cuánto guardar cada
    # archivo. Se queda con el index.html viejo, que apunta a los assets del
    # build anterior, y el deploy no se ve hasta recargar a mano. Los bloques
    # de abajo son expresiones regulares: nginx las evalúa en orden y se queda
    # con la primera que encaje, así que /assets tiene que ir antes que la
    # regla de imágenes.

    # El worker de pdf.js vive en /assets y es un módulo .mjs. nginx no trae
    # mapeada esa extensión y la sirve como application/octet-stream; el
    # navegador rechaza los módulos con ese tipo y el diagnóstico no renderiza.
    location ~* ^/assets/.+\.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Los archivos de /assets llevan un hash en el nombre: cada build genera
    # nombres nuevos, así que se pueden cachear para siempre sin riesgo.
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El resto de estáticos (fotos, favicon, fuentes) conserva el nombre entre
    # builds, así que el navegador tiene que revalidar. Con ETag la
    # revalidación devuelve 304 y no se retransmite el archivo.
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|pdf)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        # index.html es el que apunta a los assets con hash: si se cachea, el
        # navegador sigue pidiendo los del build anterior.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
