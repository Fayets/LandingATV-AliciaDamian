<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin maximum-scale: bloquear el zoom impide leer el PDF del diagnóstico
         en el móvil, y es una barrera de accesibilidad. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Safari de iOS guarda el zoom de cada pestaña y lo restaura al volver a
      // abrirla: si la página quedó ampliada una vez, se ve recortada para
      // siempre. Alternar maximum-scale al cargar obliga a Safari a devolverla
      // al 100 %, y se restaura en cuanto termina para no bloquear el pinch
      // zoom, que hace falta para leer el PDF del diagnóstico.
      (function () {
        var vp = document.querySelector('meta[name=viewport]')
        if (!vp) return
        var libre = vp.content
        vp.content = libre + ', maximum-scale=1'
        setTimeout(function () { vp.content = libre }, 400)
      })()
    </script>
    <title>Diagnóstico para corredoras</title>
    <meta
      name="description"
      content="Diagnóstico individualizado para corredoras de 30 a 60 años: qué te está frenando de verdad y una semana de entrenamientos adaptada a tu nivel."
    />
    <meta name="theme-color" content="#0B0C0F" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Diagnóstico para corredoras" />
    <meta
      property="og:description"
      content="Descubre en 6 preguntas por qué no avanzas corriendo — y llévate una semana de entrenamientos adaptada a ti."
    />

      href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  </head>
