# Mismo patrón que las demás instancias del VPS: los puertos y el nombre
# salen del .env de la raíz, así conviven varias en el mismo servidor.
services:
  postgres:
    image: postgres:18
    container_name: ${INSTANCE_NAME:-landing-alicia}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landing}
      POSTGRES_USER: ${POSTGRES_USER:-landing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env de la raíz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landing} -d ${POSTGRES_DB:-landing}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ${INSTANCE_NAME:-landing-alicia}-backend
    environment:
      PYTHONUNBUFFERED: "1"
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-8004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ${INSTANCE_NAME:-landing-alicia}-frontend
    ports:
      - "${FRONTEND_PORT:-3004}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
